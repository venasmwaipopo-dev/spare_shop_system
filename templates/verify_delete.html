{% extends "layout.html" %}

{% block content %}

<div class="profile-card">

<h1>🔒 Delete Verification</h1>

<p>Enter Admin PIN to delete this product.</p>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="password"
name="pin"
maxlength="4"
placeholder="Enter PIN"
required>

<br><br>

<button class="logout-btn">

Verify & Delete

</button>

</form>

</div>

{% endblock %}
