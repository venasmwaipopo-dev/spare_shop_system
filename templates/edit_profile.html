{% extends "layout.html" %}


{% block content %}


<div class="profile-card">


<h1>
Edit Profile
</h1>


<form method="POST">


<p>
<input type="text" 
name="fullname"
value="{{user.fullname}}"
placeholder="Jina Kamili">
</p>


<p>
<input type="email"
name="email"
value="{{user.email}}"
placeholder="Email">
</p>



<p>
<input type="text"
name="phone"
value="{{user.phone}}"
placeholder="Simu">
</p>



<p>
<input type="text"
name="address"
value="{{user.address}}"
placeholder="Anwani">
</p>



<p>
<input type="text"
name="business"
value="{{user.business}}"
placeholder="Biashara">
</p>



<button class="edit-profile">

Hifadhi Mabadiliko

</button>



</form>


</div>


{% endblock %}
